<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk RAG — Knowledge Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js" integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js" integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3" crossorigin="anonymous"></script>
</head>

<body>
    <div id="app">
        <header id="header">
            <div class="header-left">
                <span class="header-icon">🛡️</span>
                <div class="header-text">
                    <h1>Knowledge Assistant</h1>
                    <span class="header-subtitle">IPA Kenya — Cybersecurity & IT Support</span>
                </div>
            </div>
            <button id="new-chat-btn" title="Start new chat">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <line x1="8" y1="3" x2="8" y2="13" />
                    <line x1="3" y1="8" x2="13" y2="8" />
                </svg>
                New Chat
            </button>
        </header>

        <main id="messages">
            <div id="empty-state" class="empty-state">
                <div class="empty-state-bg" aria-hidden="true">
                    <div class="bg-orb bg-orb--1"></div>
                    <div class="bg-orb bg-orb--2"></div>
                    <div class="bg-orb bg-orb--3"></div>
                </div>
                <div class="empty-icon-wrapper">
                    <div class="empty-icon-ring"></div>
                    <span class="empty-icon" aria-hidden="true">&#x1F6E1;&#xFE0F;</span>
                </div>
                <h2>Your IT Security<br>Knowledge Assistant</h2>
                <p class="empty-description">
                    Get instant, accurate answers from IPA Kenya's verified cybersecurity and IT support documentation.
                </p>
                <div class="empty-divider">
                    <span>Try asking about</span>
                </div>
                <div class="suggestion-cards">
                    <button class="suggestion-card" data-query="How do I enable BitLocker?">
                        <span class="card-icon">&#x1F510;</span>
                        <span class="card-title">Enable BitLocker</span>
                        <span class="card-desc">Encrypt your Windows drives</span>
                    </button>
                    <button class="suggestion-card" data-query="What is Cryptomator and how do I use it?">
                        <span class="card-icon">&#x1F512;</span>
                        <span class="card-title">Use Cryptomator</span>
                        <span class="card-desc">Encrypt files before cloud sync</span>
                    </button>
                    <button class="suggestion-card" data-query="How do I secure my field tablet?">
                        <span class="card-icon">&#x1F4F1;</span>
                        <span class="card-title">Secure Your Tablet</span>
                        <span class="card-desc">Protect mobile devices in the field</span>
                    </button>
                    <button class="suggestion-card" data-query="What are the compliance checks?">
                        <span class="card-icon">&#x1F4CB;</span>
                        <span class="card-title">Compliance Checks</span>
                        <span class="card-desc">Stay audit-ready and compliant</span>
                    </button>
                </div>
            </div>
        </main>

        <footer id="input-area">
            <form id="chat-form">
                <div class="input-wrapper">
                    <textarea id="message-input" placeholder="Ask about IT procedures, troubleshooting, compliance..."
                        rows="1" autocomplete="off"></textarea>
                    <button type="submit" id="send-btn" title="Send message" disabled>
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                            <path
                                d="M10.894 2.553a1 1 0 0 0-1.788 0l-7 14a1 1 0 0 0 1.169 1.406l5.725-1.432L10 18.56V18l1 .25.225.927 5.725 1.432a1 1 0 0 0 1.169-1.406l-7-14z" />
                        </svg>
                    </button>
                </div>
                <span class="input-hint">Press Enter to send, Shift+Enter for new line</span>
            </form>
        </footer>
    </div>
    <script src="/static/app.js"></script>
</body>

</html>
